spring.application.name=gym-management-backend

server.port=29586
server.forward-headers-strategy=framework

# Oracle
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# NOTE: The application now persists to a single relational Oracle database, so
# multi-step flows (e.g. membership purchase, payment/refund) can rely on Spring's
# declarative @Transactional support backed by JDBC transactions.

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Swagger / OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# Admin gate for API key management (generated once, never hardcoded in source)
admin.api-key=6f2f6f2b-6a2f-4a2e-9b7e-2c6a7f9d0e11a1b2c3d4-e5f6-47a8-9b0c-d1e2f3a4b5c6

# Jackson
spring.jackson.default-property-inclusion=non_null

# Pagination defaults (offset-based, limit=20)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false
