spring.application.name=gym-management-backend

server.port=26872
server.forward-headers-strategy=framework

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/generator_db
spring.data.mongodb.auto-index-creation=true

# NOTE: The MongoDB instance used by this environment runs as a standalone node
# (not a replica set), so native multi-document ACID transactions are not available
# and no MongoTransactionManager bean is configured. Data consistency for multi-step
# flows (e.g. membership purchase, payment/refund) is preserved through validate-then-write
# ordering and unique indexes rather than Spring's declarative @Transactional. If this
# app is deployed against a MongoDB replica set, a MongoTransactionManager bean can be
# added to restore full @Transactional support.

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Swagger / OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# Admin gate for API key management (generated once, never hardcoded in source)
admin.api-key=6f2f6f2b-6a2f-4a2e-9b7e-2c6a7f9d0e11a1b2c3d4-e5f6-47a8-9b0c-d1e2f3a4b5c6

# Jackson
spring.jackson.default-property-inclusion=non_null

# Pagination defaults (offset-based, limit=20)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false
