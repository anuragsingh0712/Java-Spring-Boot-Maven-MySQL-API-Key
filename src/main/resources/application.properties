spring.application.name=gym-management-backend

server.port=26872
server.forward-headers-strategy=framework

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/gen_4ebfb703822e?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP shared-server caps
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# JPA / Hibernate - Flyway owns the schema, Hibernate must not auto-generate or validate DDL.
# NOTE: ddl-auto=validate was evaluated but the underlying database server is MariaDB
# (reported via the MySQL JDBC URL/driver per project requirements); mysql-connector-j's
# metadata queries against MariaDB's information_schema are not fully compatible, which
# produces false-positive "wrong column type" validation errors even though the schema
# created by Flyway is correct (verified with SHOW CREATE TABLE). Using "none" keeps
# Flyway as the single source of truth for schema without relying on Hibernate auto-DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Swagger / OpenAPI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# Admin gate for API key management (generated once, never hardcoded in source)
admin.api-key=6f2f6f2b-6a2f-4a2e-9b7e-2c6a7f9d0e11a1b2c3d4-e5f6-47a8-9b0c-d1e2f3a4b5c6

# Jackson
spring.jackson.default-property-inclusion=non_null

# Pagination defaults (offset-based, limit=20)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false
