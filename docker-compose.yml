version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "29586:29586"
    environment:
      SERVER_PORT: "29586"
      DB_URL: "jdbc:oracle:thin:@db:1521/FREEPDB1"
      DB_USERNAME: "myuser"
      DB_PASSWORD: "mypassword"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: gvenzl/oracle-free:23-slim
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: "mypassword"
      APP_USER: "myuser"
      APP_USER_PASSWORD: "mypassword"
    volumes:
      - db_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
