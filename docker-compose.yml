version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "29586:29586"
    environment:
      SERVER_PORT: "29586"
      DB_URL: "jdbc:postgresql://db:5432/gen_8c72c02afb70"
      DB_USERNAME: "myuser"
      DB_PASSWORD: "mypassword"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "gen_8c72c02afb70"
      POSTGRES_USER: "myuser"
      POSTGRES_PASSWORD: "mypassword"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d gen_8c72c02afb70"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
